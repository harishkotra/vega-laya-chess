name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess pytest
      - name: Ground truth and scoring tests
        run: python -m pytest tests -q
      - name: Re-derive every shipped label from its FEN
        run: python scripts/verify_positions.py --deep-options
      - name: Compile every module
        run: python -m compileall -q app scripts tests
      - name: The app must import without the model present
        run: python -c "import app.server, app.metrics, app.report; print('imports ok')"
      - name: No secrets, no env files
        run: |
          if git ls-files | grep -E '(^|/)\.env'; then
            echo "a .env file is tracked; this project keeps keys in the browser" >&2
            exit 1
          fi

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No third-party scripts or CDN references in the UI
        run: |
          if grep -rniE "cdn\.|unpkg|jsdelivr|googleapis|https://[a-z0-9.-]+\.(js|css)" web/; then
            echo "the UI must not load anything from the network" >&2
            exit 1
          fi
